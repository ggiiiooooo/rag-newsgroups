[project]
name = "rag-newsgroups"
version = "0.1.0"
description = "Учебный RAG на постах 20 Newsgroups: TF-IDF + demo-ответ с источниками"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
